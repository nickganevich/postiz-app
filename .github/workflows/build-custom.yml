name: 'Build Custom Container'

on:
  workflow_dispatch:
  push:
    branches:
      - custom

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ghcr.io/nickganevich/postiz-app:custom \
            --build-arg NEXT_PUBLIC_VERSION=custom-${{ github.sha }} \
            --pull \
            --provenance=false --sbom=false \
            --output "type=registry,name=ghcr.io/nickganevich/postiz-app:custom" .
